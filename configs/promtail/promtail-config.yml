server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: project_logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: project_logs
          __path__: /var/log/project/**/*.log
          
  - job_name: detection_json
    static_configs:
      - targets:
          - localhost
        labels:
          job: detection_json
          __path__: /var/log/project/detection.json